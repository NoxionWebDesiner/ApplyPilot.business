kind = "web"
previewPath = "/"
title = "AplyPilot Business"
version = "1.0.0"
id = "artifacts/aplypilot-business"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22075

[services.development]
run = "pnpm --filter @workspace/aplypilot-business run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aplypilot-business", "run", "build" ]
publicDir = "artifacts/aplypilot-business/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22075"
BASE_PATH = "/"
